name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload release artifacts
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shipwright-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
      - name: Validate artifact version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          wheel_pattern="dist/shipwright_readiness-${expected_version}-*.whl"
          source="dist/shipwright_readiness-${expected_version}.tar.gz"
          compgen -G "$wheel_pattern" >/dev/null || { echo "wheel version does not match ${expected_version}" >&2; exit 1; }
          test -f "$source" || { echo "sdist version does not match ${expected_version}" >&2; exit 1; }
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*
      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$REPOSITORY" --clobber
